name: Sync upstream

# 把上游 ayghri/i-have-adhd 的 main 合并进本 fork 的 main。
# 仅同步 main；上游若改动到 fork 已改的文件会合并冲突，此时本次运行失败，
# 由人工在本地解决后 push（不自动 force，不覆盖任何提交）。
on:
  schedule:
    # 每天 UTC 00:00 同步一次；GitHub cron 用 UTC，北京时间即 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write # 仅需推送 main，最小权限

# 同一时间只跑一次，避免两次同步并发 push
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 合并需要完整历史才能算出 merge base，默认 fetch-depth: 1 会失败
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git remote add upstream https://github.com/ayghri/i-have-adhd.git
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: Push to origin main
        run: git push origin main
